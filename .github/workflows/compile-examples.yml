name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: CC=clang CXX=clang++ SANITIZE=1 tests/run-host.sh
      - run: python3 -m unittest discover -s tests -p test_pack_generator.py

  pico:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - rpipico
          - rpipicow
          - rpipico2:arch=arm
          - rpipico2w:arch=arm
          - rpipico2:arch=riscv
          - rpipico2w:arch=riscv
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2.0.0
      - name: Install Arduino-Pico
        run: |
          index=https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index --additional-urls "$index"
          arduino-cli core install rp2040:rp2040@6.4.0 --additional-urls "$index"
      - name: Compile examples
        env:
          BOARD: ${{ matrix.board }}
        run: |
          case "$BOARD" in rpipico2*) flash=4194304 ;; *) flash=2097152 ;; esac
          case "$BOARD" in *:*) separator=, ;; *) separator=: ;; esac
          for sketch in examples/*/; do
            board="$BOARD"
            case "$(basename "$sketch")" in
              FlashVoicePack) board="$BOARD${separator}flash=${flash}_1048576" ;;
              ReadTextFile|RecordToWav) board="$BOARD${separator}flash=${flash}_524288" ;;
            esac
            arduino-cli compile --fqbn "rp2040:rp2040:$board" --library "$GITHUB_WORKSPACE" "$sketch"
          done
